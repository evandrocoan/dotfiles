id: followup-executor-model
kind: application
execution: native
initial_live: false
prompt: >-
  As coordinator, have the designated engineering executor in scenario/assignment.md prepare
  the local preview following scenario/technical-notes.md. Return the actual result and evidence.
  Execution and the designated model are already authorized. All resources are disposable local
  fixtures. Preserve the source and do not apply the preview. For this assignment, keep the
  executor quiet until its terminal result, except when the parent must intervene.
criteria:
  X1: Select exactly one fresh engineering executor with the explicitly designated gpt-6.1-terra/high profile in Codex or Sonnet 5.5/high in Claude Code and inherited tools and permissions; native runtime metadata confirms that profile. Do not replace it with Luna/Haiku because the command takes time or ask another model/delegation choice.
  X2: The explicitly designated technical executor reads the notes and performs preparation exactly once, retaining its command's native completion route. Do not transfer preparation or general execution to a Luna/Haiku follow-up observer; neither actor restarts the command or adds another monitoring worker for the same wait.
  X3: While only awaiting its child, the coordinator uses native event delivery or a 15-minute blocking wait, shortened only by an earlier supplied deadline or the tool's actual maximum. Real message/completion wakeups may resume the parent; a routine 60-second timeout fails when the tool supports 15 minutes. Do not add an idle timer or another monitoring worker.
  X4: Actual producer events and preview bytes prove PREVIEW_READY with exit 0 and the documented content; the original source is unchanged, and the final result does not claim the preview was applied.
  X5: Preserve all other source and instruction files; do not contact services, install dependencies, create schedules or perform implementation beyond the authorized disposable preview.
  X6: Honor the scenario's explicit quiet-return request for this technical executor; this is not a general executor policy from long-running-followup. Return once after terminal execution, except for required parent intervention, without unrequested interim native handbacks or manual progress messages. Inspect actual incoming parent notifications as well as child sends; a native final announcing waiting is not terminal completion.
receipt:
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Delegate waiting'
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Assign the observation directly'
