id: followup-independent-workers
kind: application
execution: native
initial_live: false
prompt: >-
  As coordinator, follow the two already-running executions in scenario/jobs.md with independent
  monitoring workers. Start both observers before awaiting their results, then report the supplied
  terminal statuses. Preserve source files and the existing local broker; do not start executions.
criteria:
  I1: Select two distinct native workers using the client's required observation model, fresh context and inherited tools and permissions; do not impose a global one-worker limit.
  I2: Start one wait client for op-a and one for op-b before either returns, as proven by the existing broker receiving both observation requests before releasing its results. The clients do not start or change underlying executions.
  I3: Report both actual SUCCEEDED results with exit_code 0 and their correct operation identities through native return; do not infer completion from startup.
  I4: Neither coordinator nor workers restart the broker, recursively delegate, create schedules, contact external services or change source files. A barrier timeout remains a failure, not a successful observation.
  I5: Each worker delivers one terminal handback, without unrequested interim native finals or manual progress messages. Verify actual incoming parent notifications, not only child SendMessage counts.
receipt:
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Delegate waiting'
