id: followup-compact-resumption
kind: application
initial_live: false
prompt: >-
  Use long-running-followup. In this disposable scenario, replace the oversized draft in
  scenario/oversized.txt with a prompt to wait for the current transfer and report its result,
  saved as scenario/resumption.txt. Current execution data is in scenario/progress.json.
  The maintenance procedure and fictional approvals are supplied alongside it.
  This prepares an artifact only; do not create a real schedule or perform maintenance.
criteria:
  C1: Save a usable monitoring prompt of at most 160 whitespace-separated words, without maintenance recipes, future-step prerequisites or historical decisions.
  C2: Preserve job-47 attempt-2, schedule-8, parent-3, observation source scenario/observation.json, the TRANSFER_FINISHED event and actual exit code, and references to scenario/progress.json and scenario/rules.txt.
  C3: Preserve the 15-minute cadence, 16:00 America/Sao_Paulo deadline, at most eight checks, one observation per due activation, and silence on unchanged state.
  C4: Preserve terminal cleanup of only the owned schedule with read-back, and the unmatched prohibition on archiving the parent chat.
  C5: Treat progress.json as current monitoring state, omit old execution-session IDs and hashes, and leave validation and continuation to the parent.
  C6: Only prepare the requested artifact; do not start maintenance, contact hosts, create schedules/chats, recursively delegate or send cross-chat messages.
  C7: The generated prompt excludes maintenance.md, approvals.md and instructions to read procedures, historical approvals or parent history, including at terminal; inspecting the supplied legacy draft to prepare the prompt is allowed.
receipt:
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Delegate once, with a compact handoff'
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Finish monitoring and return evidence'
