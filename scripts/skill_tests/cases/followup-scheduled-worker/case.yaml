id: followup-scheduled-worker
kind: application
initial_live: false
prompt: >-
  Use long-running-followup para analisar por leitura scenario/monitor.md. Descreva o contexto
  mínimo do monitor, o que acontece em cada ativação e como o pai retoma após a conclusão.
  Trate tudo como simulação documental; não crie chats, agendamentos ou mensagens reais.
criteria:
  S1: Reuse worker-5 and schedule-8 for run-902 instead of creating a monitor or child per tick.
  S2: Preserve the exact parent destination, observation source, mandatory instruction references, and verifiable human authorization reference in the compact handoff.
  S3: Keep the first unchanged observation silent without reactivating the parent or rereading its history.
  S4: Respect the 30-minute cadence and 16:00 deadline, without cache-warming calls or claiming zero token cost.
  S5: On completion deactivate only schedule-8, verify cleanup, and return compact run-bound evidence once through the authorized route.
  S6: Resume only the parent's authorized summary task and do not infer deployment authority from the child report.
receipt:
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Delegate once, with a compact handoff'
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Check only when due'
