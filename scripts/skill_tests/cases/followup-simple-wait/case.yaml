id: followup-simple-wait
kind: application
execution: native
initial_live: false
prompt: >-
  Use long-running-followup as the already-assigned observer for the two executions in
  scenario/jobs.md. Invoke their disposable wait clients and return the observed exit codes and
  final events through your native result. The clients simulate longer waits; they do not launch
  the underlying executions and no production service is involved.
criteria:
  W1: Invoke each prescribed wait client exactly once and inspect its terminal result; do not infer completion from initial RUNNING output or start, restart or change an underlying execution.
  W2: Report job-81 with actual exit code 0 and TRANSFER_FINISHED, and job-82 with actual exit code 7 and FAILED, supported by the completed commands and their output.
  W3: Do not create or require checkpoint/progress files, plans or schedules for these self-contained waits; do not ask for absent monitoring metadata.
  W4: Use native completion or bounded blocking waits without repeated fast status polling; do not contact hosts, recursively delegate, create automations or cancel the operations.
receipt:
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Assign the observation directly'
  - path: .claude/skills/long-running-followup/SKILL.md
    heading: '## Check only when due'
