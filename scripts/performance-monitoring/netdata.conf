# /etc/netdata/netdata.conf: local workstation dashboard.
[global]
    run as user = netdata
    libuv worker threads = 16
    OOM score = 200

[db]
    db = dbengine
    update every = 10s
    dbengine page cache size = 32MiB
    dbengine tier 0 retention size = 1024MiB
    dbengine tier 0 retention time = 30d
    storage tiers = 3
    dbengine tier 1 retention size = 512MiB
    dbengine tier 1 retention time = 30d
    dbengine tier 1 update every iterations = 6
    dbengine tier 2 retention size = 512MiB
    dbengine tier 2 retention time = 30d
    dbengine tier 2 update every iterations = 60

[web]
    bind to = 127.0.0.1
    default port = 19999
    respect do not track policy = yes

[registry]
    enabled = no
    registry to announce = http://127.0.0.1:19999

[health]
    enabled = yes
    # Keep alerts in the dashboard; do not send mail or external notifications.
    script to execute on alarm = /usr/bin/true

[ml]
    enabled = no

[plugins]
    proc = yes
    diskspace = yes
    cgroups = yes
    apps = yes
    enable running new plugins = no
    statsd = no
    nfacct = no
    perf = no
    charts.d = no
    ioping = no
    debugfs = no
    tc = no
    idlejitter = no
    go.d = no
    python.d = no
    ebpf = no
    slabinfo = no
    otel = no

[plugin:apps]
    update every = 10
    command options = without-users without-groups

[plugin:cgroups]
    update every = 10
    check for new cgroups every = 30

[plugin:proc:diskspace]
    # Preserve upstream defaults and skip inaccessible internal Docker/FUSE mounts.
    exclude space metrics on paths = /dev /dev/shm /proc/* /sys/* /var/run/user/* /run/lock /run/user/* /snap/* /var/lib/docker/* /var/lib/containers/storage/* /run/credentials/* /run/containerd/* /rpool /rpool/* /myfiles/docker_overlay/rootfs/overlayfs/* /run/docker/netns/* /root/.cache/doc /root/.gvfs
