# /etc/netdata/apps_groups.conf. Specific matches precede interpreter fallbacks.
# Unmatched processes remain visible in "other"; atop retains individual commands.
monitoring: netdata apps.plugin atop atopacctd netatop-bpf
clock-checkers: *check_clock_punches_playwright.py* *hypervisor_clock_punches_playwright.py*
litellm: litellm *litellm*
mcp-services: *kredmine* *excalidash* *gitlab-mcp*
codex: codex
claude: claude
vscode: code
smartgit: smartgit *smartgit*
chrome: chrome chromium chromium-browser
firefox: firefox
ferdium: ferdium
redpanda: redpanda
postgresql: postgres postmaster
mysql: mysqld mariadbd
redis: redis-server
minio: minio
nginx: nginx
docker: dockerd docker-proxy containerd containerd-shim* docker docker-init
kubernetes: kubelet kube-apiserver kube-controller* kube-scheduler etcd k9s
java: java
python: python python3 python3.*
node: node node-MainThread
desktop: xfce4-panel xfwm4 xfdesktop Xorg Xwayland thunar Thunar nemo
audio: pipewire wireplumber pulseaudio
remote-desktop: teamviewerd TeamViewer remmina
shells: bash sh zsh fish tmux*
system: systemd systemd-* dbus-daemon dbus-broker udevd sshd cron rsyslogd
